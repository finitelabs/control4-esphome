<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --accent: #17BCF2; --glow: var(--accent); }
  html, body { margin: 0; padding: 0; }
  body { width: 2048px; height: 424px; overflow: hidden; position: relative; font-family: Inter, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(560px 420px at 1700px 212px, color-mix(in srgb, var(--glow) 42%, transparent), transparent 70%),
      radial-gradient(900px 500px at 2150px -60px, color-mix(in srgb, var(--glow) 24%, transparent), transparent 70%),
      linear-gradient(100deg, #0c0e12 0%, #12161a 45%, #0e1618 100%); }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.06) 1.2px, transparent 1.2px); background-size: 26px 26px;
    mask-image: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.25) 40%, rgba(0,0,0,0.9) 75%); }
  .fl { position: absolute; left: 104px; top: 46px; height: 38px; filter: invert(1); opacity: 0.95; }
  h1 { position: absolute; left: 100px; top: 116px; margin: 0; color: #fff; font-size: 61px; line-height: 1; font-weight: 750; letter-spacing: -0.028em; white-space: nowrap; }
  .row { position: absolute; left: 104px; top: 216px; display: flex; align-items: center; gap: 20px; }
  .chip { height: 80px; padding: 0 32px; border-radius: 16px; display: flex; align-items: center; font-size: 38px; letter-spacing: -0.005em; white-space: nowrap; }
  .chip.solid { background: #fff; color: #111; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  .chip.line { color: #fff; border: 2px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.04); font-weight: 500; }
  .sub { position: absolute; left: 104px; top: 334px; color: #c3c8d2; font-size: 34px; font-weight: 400; letter-spacing: -0.005em; white-space: nowrap; }
  .sub em { font-style: normal; color: #fff; font-weight: 600; }
  .note { position: absolute; left: 104px; bottom: 14px; color: #7d8494; font-size: 15px; letter-spacing: 0; white-space: nowrap; }
</style></head>
<body>
<div class="dots"></div>
<svg class="scene" data-style="circuit" data-logo="../assets/brand-mark.png" data-hub="circle" data-icons="bulb,fan,lock,thermo,switch,motion" xmlns="http://www.w3.org/2000/svg"></svg>
<img class="fl" src="../assets/finite-labs-logo.png" alt="">
<h1>ESPHome in Control4.</h1>
<div class="row">
  <div class="chip solid">ESP32 and ESP8266 devices</div>
  <div class="chip line">Control4 OS 3.3+</div>
  <div class="chip line">No cloud</div>
</div>
<div class="sub">Lights, locks, climate, fans and sensors, with <em>encrypted connections</em> and <em>live updates</em>.</div>
<div class="note">ESPHome and Control4 are trademarks of their owners, which are not affiliated with, and do not endorse, this product.</div>
<script src="../assets/scene.js"></script>
</body></html>
