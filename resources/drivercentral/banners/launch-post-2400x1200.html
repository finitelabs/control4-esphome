<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --accent: #17BCF2; --glow: var(--accent); }
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 600px; overflow: hidden; position: relative; font-family: Inter, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(400px 360px at 934px 300px, color-mix(in srgb, var(--glow) 42%, transparent), transparent 70%),
      radial-gradient(700px 420px at 1290px -40px, color-mix(in srgb, var(--glow) 24%, transparent), transparent 70%),
      linear-gradient(100deg, #0c0e12 0%, #12161a 45%, #0e1618 100%); }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.06) 1.2px, transparent 1.2px); background-size: 22px 22px;
    mask-image: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.25) 40%, rgba(0,0,0,0.9) 75%); }
  .col { position: absolute; left: 72px; top: 0; height: 600px; display: flex; flex-direction: column; justify-content: center; }
  .fl { height: 28px; width: max-content; filter: invert(1); opacity: 0.95; margin: 0 0 34px 2px; }
  h1 { margin: 0; color: #fff; font-size: 50px; line-height: 1.08; font-weight: 750; letter-spacing: -0.028em; }
  .row { display: flex; align-items: center; gap: 12px; margin: 34px 0 0 2px; }
  .chip { height: 46px; padding: 0 18px; border-radius: 11px; display: flex; align-items: center; font-size: 21px; font-weight: 600; letter-spacing: -0.005em; white-space: nowrap; }
  .chip.solid { background: #fff; color: #111; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  .chip.line { color: #fff; border: 1.5px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.04); font-weight: 500; }
  .sub { margin: 32px 0 0 2px; color: #c3c8d2; font-size: 24px; line-height: 1.4; font-weight: 400; letter-spacing: -0.005em; }
  .sub em { font-style: normal; color: #fff; font-weight: 600; }
  .mark { position: absolute; left: 814px; top: 180px; width: 240px; height: 240px; object-fit: contain; filter: drop-shadow(0 14px 32px rgba(0,0,0,0.45)); }
</style></head>
<body>
<div class="dots"></div>
<img class="mark" src="../assets/brand-mark.png" alt="" onerror="this.remove()">
<div class="col">
  <img class="fl" src="../assets/finite-labs-logo.png" alt="">
  <h1>Driver Name<br>in Control4.</h1>
  <div class="row">
    <div class="chip solid">What it controls</div>
    <div class="chip line">Control4 OS 3.3+</div>
    <div class="chip line">Local network</div>
  </div>
  <div class="sub">The devices it covers,<br>with <em>one feature</em> and <em>another</em>.</div>
</div>
</body></html>
