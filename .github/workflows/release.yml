name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Wait for build and download oss artifacts
        run: |
          echo "Waiting for Build workflow to complete for $GITHUB_SHA..."
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while true; do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build.yml \
              --commit "$GITHUB_SHA" \
              --json databaseId,status,conclusion \
              --jq '.[] | select(.status == "completed") | .databaseId' \
              | head -1)
            if [ -n "$run_id" ]; then
              echo "Build run $run_id completed"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No completed Build run for $GITHUB_SHA after $WAIT_MINUTES minutes. Check that Build was triggered for this tag and is not queued behind another run."
              exit 1
            fi
            echo "Build not finished yet, waiting 30s..."
            sleep 30
          done

          conclusion=$(gh run view "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion --jq '.conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "::error::Build run $run_id finished with: $conclusion"
            exit 1
          fi

          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name oss \
            --dir dist/oss
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_MINUTES: 20

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/oss/c4z/*.c4z
            dist/oss/docs/*.pdf
            dist/oss/*.zip
