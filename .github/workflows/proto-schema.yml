# Kept out of build.yml so `copier update` cannot clobber this.
name: Proto schema

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  proto-schema:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve the vendored lua-protobuf release
        id: runtime
        run: |
          ref=$(make -s protobuf-ref)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout lua-protobuf at that release
        uses: actions/checkout@v6
        with:
          repository: finitelabs/lua-protobuf
          ref: ${{ steps.runtime.outputs.ref }}
          path: .lua-protobuf

      - name: Check the proto schema provenance
        run: make check-proto LUA_PROTOBUF=.lua-protobuf
