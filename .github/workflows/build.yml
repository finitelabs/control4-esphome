name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # The updater compares a .c4z's version with its release tag, so a tag build
      # stamps the tag's date (make's DRIVER_VERSION), not the runner's UTC date.
      - name: Driver version from tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "Not a tag build; make stamps today's date."
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]{4}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01]))(-.+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vYYYYMMDD or vYYYYMMDD-suffix, so it cannot give the driver version."
            exit 1
          fi
          echo "DRIVER_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "Stamping driver version ${BASH_REMATCH[1]} from tag $GITHUB_REF_NAME."

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: 'luajit-2.1'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Setup stylua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev \
            libxslt-dev \
            libssl-dev \
            swig \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-noto-core \
            fonts-symbola

      - name: Initialize project
        run: make init

      - name: Check formatting
        run: make check

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Verify PDFs were generated
        run: |
          for build in drivercentral oss; do
            pdf_count=$(find "dist/$build/docs" -name '*.pdf' 2>/dev/null | wc -l)
            if [ "$pdf_count" -eq 0 ]; then
              echo "::error::No PDF files found in dist/$build/docs"
              ls -la "dist/$build/docs/" || true
              exit 1
            fi
            echo "Found $pdf_count PDF(s) in dist/$build/docs"
          done

      - name: Verify the c4z carries the tag version
        if: github.ref_type == 'tag'
        run: |
          for build in drivercentral oss; do
            for c4z in "dist/$build/c4z"/*.c4z; do
              got=$(python3 -c 'import re, sys, zipfile; m = re.search(r"<version>(.*?)</version>", zipfile.ZipFile(sys.argv[1]).read("driver.xml").decode(), re.S); print(m.group(1) if m else "")' "$c4z")
              if [ "$got" != "$DRIVER_VERSION" ]; then
                echo "::error::$c4z has driver version '$got', expected '$DRIVER_VERSION' from tag $GITHUB_REF_NAME"
                exit 1
              fi
              echo "$c4z: $got"
            done
          done

      - name: Check for dirty tree
        run: |
          git diff --exit-code || { echo "::error::Uncommitted changes after build"; exit 1; }
          UNTRACKED=$(git ls-files --others --exclude-standard)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Untracked files after build:"
            echo "$UNTRACKED"
            exit 1
          fi


      - name: Upload drivercentral artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drivercentral
          path: dist/drivercentral/*
          if-no-files-found: error

      - name: Upload oss artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oss
          path: dist/oss/*
          if-no-files-found: error