name: Build (xvfb test)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: '5.3'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            luajit \
            libxml2-dev \
            libxslt-dev \
            libssl-dev \
            swig \
            pandoc \
            xmlstarlet \
            xvfb \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64

      - name: Initialize project
        run: make init

      - name: Build
        env:
          ELECTRON_EXTRA_LAUNCH_ARGS: '--no-sandbox --disable-gpu'
          DEBUG: 'electronpdf:*'
        run: xvfb-run make build

      - name: Check for dirty tree
        run: |
          git diff --exit-code || { echo "::error::Uncommitted changes after build"; exit 1; }
          UNTRACKED=$(git ls-files --others --exclude-standard)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Untracked files after build:"
            echo "$UNTRACKED"
            exit 1
          fi

      - name: Summarize build artifacts
        if: always()
        run: |
          echo "## Build Artifacts" >> "$GITHUB_STEP_SUMMARY"
          for dir in dist/*/; do
            [ ! -d "$dir" ] && continue
            [ "$(basename "$dir")" = "driverpackager" ] && continue
            dist_name=$(basename "$dir")
            echo "### ${dist_name}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            (cd "$dir" && ls -lhS *.c4z *.pdf *.zip 2>/dev/null || echo "(no files)")  >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload driver packages (.c4z)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-packages
          path: |
            dist/**/*.c4z
            !dist/driverpackager/
          if-no-files-found: ignore

      - name: Upload release bundles (.zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: dist/**/*.zip
          if-no-files-found: ignore

      - name: Upload documentation (.pdf)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: dist/**/*.pdf
          if-no-files-found: ignore
